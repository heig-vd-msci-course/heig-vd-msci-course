name: Documentation

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: GitHub Pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  generate-presentations:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Generate presentations with Marp
        uses: docker://marpteam/marp-cli:v4.2.3
        with:
          entrypoint: bash
          args: generate-presentations.sh

      - name: Upload presentation files
        uses: actions/upload-artifact@v4
        with:
          name: presentation-files
          path: docs/slides/
          if-no-files-found: error
          retention-days: 1

  build-website:
    runs-on: ubuntu-latest
    needs: generate-presentations
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download presentation files
        uses: actions/download-artifact@v4
        with:
          name: presentation-files
          path: docs/slides/

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.x

      - name: Install Zensical
        run: pip install zensical

      - name: Build site
        run: zensical build --clean

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    runs-on: ubuntu-latest
    needs: build-website
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
