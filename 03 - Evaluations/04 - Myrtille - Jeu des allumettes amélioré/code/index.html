<!doctype html><body><style>body {
  font-family: Arial, Helvetica, sans-serif;
  background-color: #2e2a5e;
  color: #333;
  margin: 0;
  padding: 30px 15px;
  text-align: center;
}
h1,
p,
button,
#tas {
  position: relative;
}
h1 {
  color: white;
  font-size: 2.2em;
  margin-bottom: 25px;
  text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.4);
}
#message {
  display: inline-block;
  background-color: #f4c95d;
  color: #2e2a5e;
  font-size: 1.3em;
  font-weight: bold;
  padding: 10px 25px;
  border-radius: 20px;
  margin: 10px 0;
}
p {
  color: white;
  font-size: 1.1em;
}
#compteur {
  font-weight: bold;
  font-size: 1.4em;
  color: #f4c95d;
}
button {
  background-color: #7b6fd6;
  color: white;
  border: none;
  border-radius: 10px;
  padding: 10px 18px;
  margin: 5px;
  font-size: 1em;
  cursor: pointer;
  transition: transform 0.2s, background-color 0.2s;
}
button:hover:not(:disabled) {
  background-color: #9a8fef;
  transform: scale(1.07);
}
button:disabled {
  background-color: #8c8aa8;
  cursor: not-allowed;
  opacity: 0.5;
}
#recommencer {
  background-color: crimson;
}
#recommencer:hover {
  background-color: #e8284f !important;
}
#tas {
  background-color: #f5f0e6;
  max-width: 700px;
  margin: 30px auto 0;
  padding: 25px 15px;
  border-radius: 15px;
  box-shadow: 0 6px 15px rgba(0, 0, 0, 0.4);
}
.allumette {
  display: inline-block;
  width: 8px;
  height: 60px;
  margin: 0 4px;
  background-color: burlywood;
  border-top: 14px solid crimson;
  border-radius: 6px 6px 2px 2px;
  box-shadow: 1px 2px 3px rgba(0, 0, 0, 0.3);
}
.source {
  position: fixed;
  bottom: 10px;
  left: 15px;
  margin: 0;
  font-size: 0.8em;
  font-style: italic;
  color: #b9b4e6;
  text-align: left;
}

#accueil {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-color: rgba(46, 42, 94, 0.92);
  z-index: 10;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}
#accueil input {
  padding: 8px;
  border: none;
  border-radius: 8px;
  font-size: 1em;
  text-align: center;
}
#accueil #nombre {
  width: 70px;
}

#message.j1 {
  background-color: #f4c95d;
}
#message.j2 {
  background-color: #6fd6b0;
}</style><h1>Jeu des allumettes <br>Team myrtille</h1>
<div id="accueil">
  <p>Joueur 1 : <input id="nom1" value="Joueur 1"></p>
  <p>Joueur 2 : <input id="nom2" value="Joueur 2"></p>
  <p>Nombre d'allumettes : <input id="nombre" type="number" min="4" max="50" value="20"></p>
  <button id="commencer">Commencer</button>
</div>
<p id="message"></p>
<p>Il reste <span id="compteur"></span> allumettes.</p>
<button id="retirer">Retirer 1 allumette</button>
<button id="retirer2">Retirer 2 allumettes</button>
<button id="retirer3">Retirer 3 allumettes</button>
<button id="recommencer">Recommencer</button>
<div id="tas"></div>
<p class="source">CSS généré avec l'aide de Claude</p><script>
let allumettes;
let joueuse = 1;
const noms = [];
const accueil = document.querySelector("#accueil");
const nom1 = document.querySelector("#nom1");
const nom2 = document.querySelector("#nom2");
const nombre = document.querySelector("#nombre");
const compteur = document.querySelector("#compteur");
const message = document.querySelector("#message");
const tas = document.querySelector("#tas");
const bouton = document.querySelector("#retirer");
const bouton2 = document.querySelector("#retirer2");
const bouton3 = document.querySelector("#retirer3");
const boutonr = document.querySelector("#recommencer");

document.querySelector("#commencer").addEventListener("click", function () {
  noms[1] = nom1.value || "Joueur 1";
  noms[2] = nom2.value || "Joueur 2";

  allumettes = Number(nombre.value);
  if (allumettes < 4) allumettes = 4;
  if (allumettes > 50) allumettes = 50;

  accueil.remove();
  message.textContent = "Au tour de " + noms[joueuse];
  message.className = "j" + joueuse;
  afficher();
});

bouton.addEventListener("click", function () {
  allumettes = allumettes - 1;
  test();
});
bouton2.addEventListener("click", function () {
  allumettes = allumettes - 2;
  test();
});
bouton3.addEventListener("click", function () {
  allumettes = allumettes - 3;
  test();
});
boutonr.addEventListener("click", function () {
  location.reload();
});

function afficher() {
  tas.innerHTML = "";
  for (let i = 0; i < allumettes; i++) {
    tas.innerHTML = tas.innerHTML + '<span class="allumette"></span>';
  }
  compteur.textContent = allumettes;
}

function test() {
  afficher();
  if (allumettes == 0) {
    message.textContent = noms[joueuse] + " a perdu !";
    bouton.disabled = true;
    bouton2.disabled = true;
    bouton3.disabled = true;
  } else {
    if (joueuse == 1) {
      joueuse = 2;
    } else {
      joueuse = 1;
    }
    message.textContent = "Au tour de " + noms[joueuse];
    message.className = "j" + joueuse;
    if (allumettes < 3) bouton3.disabled = true;
    if (allumettes < 2) bouton2.disabled = true;
  }
}</script></body>
