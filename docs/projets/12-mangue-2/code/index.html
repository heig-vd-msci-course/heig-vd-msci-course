<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Mangue 2 - Blackjack</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<h1>♠ BLACKJACK ♥</h1>

<p id="argent">Argent : 100 CHF</p>

<label for"mise">Ta mise :</label>
<input type="number" id="mise" value="10" min="1"

<div class="table">
  <h2>Croupier</h2>
  <div id="cartesCroupier"></div>
  <p id="scoreCroupier">Points : ?</p>

  <hr>

  <h2>Joueur</h2>
  <div id="cartesJoueur"></div>
  <p id="scoreJoueur">Points : 0</p>
</div>

<p id="message">Bienvenue au Blackjack !</p>

<button id="tirer" onclick="tirerCarte()">Tirer</button>
<button id="rester" onclick="rester()">Rester</button>
<button id="rejouer" onclick="nouvellePartie()">Rejouer</button>
<script src="script.js"></script>
</body>
</html>
