<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>MSCI - Signalétique</title>
<style>
  @page { size: A4 landscape; margin: 0; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Arial, Helvetica, sans-serif; }
  .sign { width: 297mm; height: 210mm; padding: 14mm 18mm; display: flex; flex-direction: column; align-items: center; justify-content: space-between; page-break-after: always; break-after: page; }
  .sign:last-child { page-break-after: auto; break-after: auto; }
  .title { font-size: 120pt; font-weight: 900; letter-spacing: 6mm; color: #222; line-height: 1; }
  .arrow { width: 120mm; height: 120mm; }
  .label { font-size: 40pt; font-weight: bold; color: #ff6b6b; }
</style>
</head>
<body>
<div id="signs"></div>
<script>
  // Flèche pointant vers le haut, tournée selon la direction
  var arrow = '<polygon points="50,4 92,48 64,48 64,96 36,96 36,48 8,48" fill="#222"/>';
  var signs = [
    { label: "Tout droit", rotate: 0 },
    { label: "À gauche", rotate: -90 },
    { label: "À droite", rotate: 90 }
  ];
  document.getElementById("signs").innerHTML = signs.map(function (s) {
    return '<section class="sign"><div class="title">MSCI</div>' +
      '<svg class="arrow" viewBox="0 0 100 100"><g transform="rotate(' + s.rotate + ' 50 50)">' + arrow + '</g></svg>' +
      '<div class="label">' + s.label + '</div></section>';
  }).join("");
</script>
</body>
</html>
